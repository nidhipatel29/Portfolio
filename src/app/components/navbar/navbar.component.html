<header class="site-header" [class.is-scrolled]="isScrolled()">
  <div class="nav-shell">
    <a class="brand" href="#home" (click)="closeMenu()" aria-label="Nidhi Patel, home">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span>{{ portfolio.name }}</span>
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      @for (link of portfolio.navigation; track link.id) {
        <a
          [href]="'#' + link.id"
          [class.is-active]="activeSection() === link.id"
          [attr.aria-current]="activeSection() === link.id ? 'location' : null"
          (click)="navigateTo(link)"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="nav-actions">
      <button
        class="theme-toggle"
        type="button"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.aria-pressed]="theme() === 'light'"
        (click)="toggleTheme()"
      >
        @if (theme() === 'dark') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" /></svg>
        }
      </button>
      <button
        class="menu-toggle"
        type="button"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-navigation"
        [attr.aria-label]="isMenuOpen() ? 'Close navigation menu' : 'Open navigation menu'"
        (click)="toggleMenu()"
      >
        @if (isMenuOpen()) {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        }
      </button>
    </div>
  </div>

  <nav
    id="mobile-navigation"
    class="mobile-nav"
    aria-label="Mobile navigation"
    [class.is-open]="isMenuOpen()"
    [attr.inert]="isMenuOpen() ? null : ''"
  >
    @for (link of portfolio.navigation; track link.id) {
      <a
        [href]="'#' + link.id"
        [class.is-active]="activeSection() === link.id"
        [attr.aria-current]="activeSection() === link.id ? 'location' : null"
        (click)="navigateTo(link)"
      >
        {{ link.label }}
      </a>
    }
  </nav>
</header>
