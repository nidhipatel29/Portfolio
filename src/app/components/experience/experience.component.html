<section class="content-section" id="experience" aria-labelledby="experience-title">
  <div class="section-shell">
    <header class="section-heading">
      <p class="section-kicker">Experience</p>
      <h2 id="experience-title" class="section-title">Professional experience</h2>
    </header>
    <div class="experience-timeline">
      @for (position of experience; track position.company) {
        <article class="experience-item">
          <div class="experience-heading">
            <div>
              <h3>{{ position.role }}</h3>
              <p class="experience-company">{{ position.company }}</p>
            </div>
            <p class="experience-dates">{{ position.dates }}</p>
          </div>
          <ul class="experience-highlights">
            @for (highlight of position.highlights; track highlight) {
              <li>{{ highlight }}</li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
