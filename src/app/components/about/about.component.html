<section class="content-section" id="about" aria-labelledby="about-title">
  <div class="section-shell">
    <header class="section-heading">
      <p class="section-kicker">About</p>
      <h2 id="about-title" class="section-title">A little about my work</h2>
    </header>
    <div class="about-layout">
      <p class="about-summary">{{ portfolio.summary }}</p>
      <dl class="about-facts">
        <div class="about-fact">
          <dt>Location</dt>
          <dd>{{ portfolio.location }}</dd>
        </div>
        <div class="about-fact">
          <dt>Focus</dt>
          <dd>{{ portfolio.headline }}</dd>
        </div>
      </dl>
    </div>
  </div>
</section>
